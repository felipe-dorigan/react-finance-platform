openapi: 3.0.3
info:
  title: React Finance Platform Mock API
  version: 0.1.0
  description: Contrato de API mock para a feature de carteiras, contas, cartões, transações e permissões.
servers:
  - url: /api
paths:
  /session:
    get:
      summary: Retorna sessão autenticada mockada
      responses:
        "200":
          description: Sessão mock ativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /wallets:
    get:
      summary: Lista carteiras do usuário
      responses:
        "200":
          description: Lista de carteiras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
    post:
      summary: Cria carteira (limite 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Carteira criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "422":
          description: Limite de duas carteiras excedido

  /wallets/{walletId}/accounts:
    get:
      summary: Lista contas da carteira
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "200":
          description: Lista de contas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      summary: Cria conta
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Conta criada

  /wallets/{walletId}/accounts/{accountId}:
    delete:
      summary: Exclui conta definitivamente (hard-delete)
      description: Remove a conta e entradas/saídas/transferências vinculadas na carteira atual, com recálculo dos agregados.
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Conta e vínculos removidos com recálculo concluído
        "409":
          description: Conta possui cartão vinculado e exclusão foi bloqueada

  /wallets/{walletId}/cards:
    get:
      summary: Lista cartões da carteira
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "200":
          description: Lista de cartões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
    post:
      summary: Cria cartão com conta de débito vinculada
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Cartão criado
        "422":
          description: Conta de débito inválida/inativa

  /wallets/{walletId}/cards/{cardId}:
    get:
      summary: Retorna detalhe do cartao e seus registros vinculados
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Detalhe do cartao com despesas e creditos vinculados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
    delete:
      summary: Exclui cartão definitivamente (hard-delete)
      description: Remove o cartão e despesas/estornos vinculados na carteira atual, com recálculo dos agregados.
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Cartão e vínculos removidos com recálculo concluído

  /wallets/{walletId}/cards/{cardId}/debit-account:
    patch:
      summary: Altera a conta de debito vinculada ao cartao
      description: Operacao de vinculo conta-cartao com alvo de processamento <1s no ambiente padrao.
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/CardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCardDebitAccountRequest"
      responses:
        "200":
          description: Vinculo atualizado com sucesso
        "422":
          description: Conta invalida ou inativa para vinculo

  /wallets/{walletId}/cards/{cardId}/records:
    post:
      summary: Registra operacao vinculada ao cartao (despesa ou credito)
      description: Operacao de vinculo registro-cartao com alvo de processamento <1s no ambiente padrao.
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/CardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardLinkedRecordRequest"
      responses:
        "201":
          description: Registro vinculado ao cartao criado
        "422":
          description: Violacao de regra de dominio

  /wallets/{walletId}/transactions:
    get:
      summary: Lista transações da carteira
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - in: query
          name: status
          schema:
            type: string
            enum: [effective, pending]
        - in: query
          name: cardId
          required: false
          schema:
            type: string
            format: uuid
          description: Quando informado, filtra somente registros vinculados ao cartão.
      responses:
        "200":
          description: Lista de transações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      summary: Cria transação
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transação criada
        "409":
          description: Possível duplicidade detectada; confirmação explícita necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateDetectionError"
        "422":
          description: Violação de regra de domínio

  /wallets/{walletId}/transactions/{transactionId}:
    patch:
      summary: Atualiza transação existente
      description: Na edição, a detecção de duplicidade deve rodar apenas quando valor, data, tipo ou vínculo principal (conta/cartão) forem alterados.
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"
      responses:
        "200":
          description: Transação atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "409":
          description: Possível duplicidade detectada na edição; confirmação explícita necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateDetectionError"
        "422":
          description: Violação de regra de domínio

  /wallets/{walletId}/expenses:
    get:
      summary: Lista despesas da carteira (inclui despesas de cartão)
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - in: query
          name: cardId
          required: false
          schema:
            type: string
            format: uuid
          description: Quando informado, retorna somente despesas vinculadas ao cartão.
      responses:
        "200":
          description: Lista de despesas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"

  /wallets/{walletId}/expenses/{expenseId}/pay:
    patch:
      summary: Marca despesa de cartão como paga e debita conta selecionada
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - in: path
          name: expenseId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayExpenseRequest"
      responses:
        "200":
          description: Despesa atualizada para paga com débito em conta aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "422":
          description: Conta inválida/inativa ou despesa não elegível para pagamento

  /wallets/{walletId}/permissions:
    get:
      summary: Lista permissões por e-mail convidado
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "200":
          description: Lista de permissões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletPermission"
    post:
      summary: Cria ou atualiza convite/permissão
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPermissionRequest"
      responses:
        "200":
          description: Convite atualizado
        "201":
          description: Convite criado

  /wallets/{walletId}/invites:
    post:
      summary: Envia convite para colaboracao da carteira
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Convite criado
        "200":
          description: Convite atualizado para novo papel

  /wallets/{walletId}/audit-events:
    get:
      summary: Lista eventos de auditoria da carteira
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  /telemetry/events:
    post:
      summary: Registra evento estruturado de telemetria do cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryEvent"
      responses:
        "202":
          description: Evento aceito para processamento assíncrono

  /error-signals:
    post:
      summary: Registra sinal de erro observável do cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorSignal"
      responses:
        "202":
          description: Sinal de erro aceito para processamento assíncrono

components:
  parameters:
    WalletId:
      in: path
      name: walletId
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      in: path
      name: cardId
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Session:
      type: object
      required: [userId, email]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email

    Wallet:
      type: object
      required: [id, name, timezone, mainBalance, projectedBalance]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: Timezone IANA da carteira usado para regras temporais de negócio.
        mainBalance:
          type: string
        projectedBalance:
          type: string

    Account:
      type: object
      required: [id, walletId, name, status, balance]
      properties:
        id:
          type: string
        walletId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        balance:
          type: string

    Card:
      type: object
      required: [id, walletId, name, debitAccountId, status]
      properties:
        id:
          type: string
        walletId:
          type: string
        name:
          type: string
        debitAccountId:
          type: string
        status:
          type: string
          enum: [active, inactive]

    CardDetailResponse:
      type: object
      required: [card, linkedRecords]
      properties:
        card:
          $ref: "#/components/schemas/Card"
        linkedRecords:
          type: array
          items:
            $ref: "#/components/schemas/CardLinkedRecord"

    CardLinkedRecord:
      type: object
      required: [id, cardId, type, amount, occurredAt]
      properties:
        id:
          type: string
        cardId:
          type: string
        type:
          type: string
          enum: [expense, credit]
        amount:
          type: string
        originalTransactionId:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time

    Transaction:
      type: object
      required: [id, walletId, type, status, amount, date]
      properties:
        id:
          type: string
        walletId:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        status:
          type: string
          enum: [effective, pending]
        amount:
          type: string
        date:
          type: string
          format: date-time
        period:
          type: string
          nullable: true
          enum: [daily, weekly, monthly, yearly]
        sourceAccountId:
          type: string
          nullable: true
        destinationAccountId:
          type: string
          nullable: true
        cardId:
          type: string
          nullable: true
        cardExpensePaymentStatus:
          type: string
          nullable: true
          enum: [unpaid, paid]
        paidFromAccountId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true

    Expense:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [expense]

    WalletPermission:
      type: object
      required: [id, walletId, invitedEmail, role]
      properties:
        id:
          type: string
        walletId:
          type: string
        invitedEmail:
          type: string
          format: email
        role:
          type: string
          enum: [read, edit, operate]
        roleLabel:
          type: string
          enum: [leitura, leitura+edicao, acesso_total_operacional]
          description: Rotulo canonico exibido ao usuario para o nivel de permissao.

    AuditEvent:
      type: object
      required: [id, walletId, action, entityType, entityId, occurredAt]
      properties:
        id:
          type: string
        walletId:
          type: string
        actorUserId:
          type: string
          nullable: true
        actorEmail:
          type: string
          format: email
          nullable: true
        actorRole:
          type: string
          enum: [owner, read, edit, operate]
        action:
          type: string
        entityType:
          type: string
          enum: [account, card, transaction, invite, permission]
        entityId:
          type: string
        changedFields:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ChangedField"
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

    TelemetryEvent:
      type: object
      required: [id, route, eventName, category, occurredAt]
      properties:
        id:
          type: string
        walletId:
          type: string
          nullable: true
        sessionId:
          type: string
        correlationId:
          type: string
        route:
          type: string
        eventName:
          type: string
        category:
          type: string
        properties:
          type: object
          nullable: true
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

    ErrorSignal:
      type: object
      required: [id, source, errorCode, message, severity, occurredAt]
      properties:
        id:
          type: string
        walletId:
          type: string
          nullable: true
        sessionId:
          type: string
        correlationId:
          type: string
        route:
          type: string
        source:
          type: string
        errorCode:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [info, warning, error, critical]
        stack:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time

    ChangedField:
      type: object
      required: [field, from, to]
      properties:
        field:
          type: string
        from:
          nullable: true
        to:
          nullable: true

    CreateAccountRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [checking, savings, cash, other]

    CreateCardRequest:
      type: object
      required: [name, debitAccountId]
      properties:
        name:
          type: string
        debitAccountId:
          type: string

    ChangeCardDebitAccountRequest:
      type: object
      required: [debitAccountId]
      properties:
        debitAccountId:
          type: string

    CreateCardLinkedRecordRequest:
      type: object
      required: [type, amount, occurredAt]
      properties:
        type:
          type: string
          enum: [expense, credit]
        amount:
          type: string
        occurredAt:
          type: string
          format: date-time
        originalTransactionId:
          type: string
          nullable: true

    CreateTransactionRequest:
      type: object
      required: [type, status, amount, date]
      properties:
        type:
          type: string
          enum: [income, expense, transfer]
        status:
          type: string
          enum: [effective, pending]
        amount:
          type: string
        date:
          type: string
          format: date-time
        period:
          type: string
          nullable: true
          enum: [daily, weekly, monthly, yearly]
        sourceAccountId:
          type: string
          nullable: true
        destinationAccountId:
          type: string
          nullable: true
        cardId:
          type: string
          nullable: true
        duplicateConfirmation:
          type: boolean
          default: false
          description: Deve ser true para persistir quando houver detecção de possível duplicidade.

    UpdateTransactionRequest:
      type: object
      description: Campos de transação permitidos para edição. Se campos-chave mudarem, aplicar detector de duplicidade.
      properties:
        type:
          type: string
          enum: [income, expense, transfer]
        status:
          type: string
          enum: [effective, pending]
        amount:
          type: string
        date:
          type: string
          format: date-time
        period:
          type: string
          nullable: true
          enum: [daily, weekly, monthly, yearly]
        sourceAccountId:
          type: string
          nullable: true
        destinationAccountId:
          type: string
          nullable: true
        cardId:
          type: string
          nullable: true
        duplicateConfirmation:
          type: boolean
          default: false
          description: Deve ser true para concluir edição quando houver detecção de possível duplicidade.

    PayExpenseRequest:
      type: object
      required: [paidFromAccountId]
      properties:
        paidFromAccountId:
          type: string
          format: uuid

    DuplicateDetectionError:
      type: object
      required: [code, message, duplicateCandidate]
      properties:
        code:
          type: string
          enum: [POSSIBLE_DUPLICATE]
        message:
          type: string
        duplicateCandidate:
          type: object
          required: [matchedTransactionId, fingerprint, detectedAt]
          properties:
            matchedTransactionId:
              type: string
              format: uuid
            fingerprint:
              type: string
            detectedAt:
              type: string
              format: date-time

    UpsertPermissionRequest:
      type: object
      required: [invitedEmail, role]
      properties:
        invitedEmail:
          type: string
          format: email
        role:
          type: string
          enum: [read, edit, operate]

    CreateInviteRequest:
      type: object
      required: [invitedEmail, role]
      properties:
        invitedEmail:
          type: string
          format: email
        role:
          type: string
          enum: [read, edit, operate]
